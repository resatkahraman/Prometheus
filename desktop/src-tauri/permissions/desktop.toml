[[permission]]
identifier="desktop-bootstrap"
description="Allows the Prometheus Desktop main window to invoke the bounded desktop bootstrap command."
commands.allow=["desktop_bootstrap"]

[[permission]]
identifier="desktop-core-status"
description="Allows the Prometheus Desktop main window to read bounded local Core status."
commands.allow=["desktop_core_status"]

[[permission]]
identifier="desktop-core-runtime"
description="Allows the Prometheus Desktop main window to inspect and explicitly control the bounded canonical Core runtime."
commands.allow=["desktop_runtime_status","desktop_start_core","desktop_stop_core"]

[[permission]]
identifier="desktop-model-catalog"
description="Allows the Prometheus Desktop main window to read bounded canonical model and agent metadata."
commands.allow=["desktop_model_catalog"]

[[permission]]
identifier="desktop-submit-command"
description="Allows the Prometheus Desktop main window to submit a bounded command to the local Core."
commands.allow=["desktop_submit_command"]

[[permission]]
identifier="desktop-mission-read"
description="Allows the Prometheus Desktop main window to read canonical mission state and activity."
commands.allow=["desktop_mission","desktop_mission_events"]

[[permission]]
identifier="desktop-approval-decision"
description="Allows the Prometheus Desktop main window to submit an explicitly bound approval decision."
commands.allow=["desktop_approve_task","desktop_reject_task"]

[[permission]]
identifier="desktop-approval-review"
description="Allows the Prometheus Desktop main window to read bounded canonical approval review evidence."
commands.allow=["desktop_approval_review"]

[[permission]]
identifier="desktop-history-read"
description="Allows the Prometheus Desktop main window to read bounded canonical activity, receipts and memory."
commands.allow=["desktop_mission_history","desktop_mission_receipts","desktop_mission_memory"]

[[permission]]
identifier="desktop-native-os"
description="Allows only validated, typed and user-driven native OS integration commands."
commands.allow=["desktop_native_environment","desktop_native_capabilities","desktop_native_select_file","desktop_native_select_folder","desktop_native_reveal_path","desktop_native_read_clipboard","desktop_native_write_clipboard","desktop_native_notify","desktop_native_open_external_url"]
